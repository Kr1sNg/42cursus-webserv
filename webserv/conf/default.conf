server {
    listen 127.0.0.1:8080;
    server_name server1;
    root www;

    location / {
        index addition.html;
        autoindex off;
        methods GET POST;
    }

	location /images/ {
        root www/public;
		index server2.html;
        autoindex off;
        methods GET POST;
	}

	location /uploads/ {
        index upload.html;
        methods GET POST;
	}

    location /public/ {
        index public.html;
        methods GET POST DELETE;
	}

    error_page 400 /error/400-v0.html;
    error_page 403 /error/403.html;
	error_page 404 /error/404.html;
    error_page 405 /error/405-v0.html;
    error_page 500 /error/500-v0.html;
    error_page 501 /error/501-v0.html;
}
