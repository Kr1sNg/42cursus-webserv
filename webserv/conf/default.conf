server {
    listen 127.0.0.1:8080;
    server_name server1;
    root www;

    location / {
        index test2.html;
        autoindex off;
        methods GET POST;
    }

	location /images/ {
		index image.html;
        autoindex off;
        methods GET POST;
	}

	location /uploads/ {
        index upload.html;
        methods GET POST;
	}

	error_page 404 /error/404.html;
    error_page 405 /error/405.html;
    error_page 403 /error/403.html;
}