<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv — other server 2</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: url('serv2.png') no-repeat center 45% fixed;
            background-size: cover;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            animation: floatBackground 12s ease-in-out infinite;
        }

        @keyframes floatBackground {
            0% { background-position: center 45%; }
            50% { background-position: center 48%; }
            100% { background-position: center 45%; }
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2.5rem;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-radius: 0 0 20px 20px;
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 1.8rem;
            color: #444;
            margin: 0;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #555;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #ff8c8c;
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            text-align: center;
            animation: floatBox 6s ease-in-out infinite;
        }

        @keyframes floatBox {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .quote-box h2 {
            color: #444;
            font-weight: 600;
            font-size: 1.4rem;
            margin: 0 0 10px 0;
        }

        .quote-box p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Webserv</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/uploads/">Uploads</a>
            <a href="/public/">Delete</a>
            <a href="/form.html">CGI</a>
            <a href="/autoindex/">Autoindex</a>
            <a href="/redirect/">Redirect</a>
            <a href="/session/">Session</a>
        </nav>
    </header>

    <main>
        <div class="quote-box">
            <h2>Welcome to the server 2 !</h2>
            <p>Being two - or more - is better to be alone.</p>
        </div>
    </main>

    <footer>
        © 2025 Webserv — Made by 3 weebs
    </footer>

</body>
</html>
