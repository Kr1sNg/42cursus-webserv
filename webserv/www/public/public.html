<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DELETE File Test</title>
</head>
<body>
  <h1>DELETE File Test</h1>

  <p>Enter the file URL inside folder public to delete (must start with <code>/public/</code>):</p>

  <input id="filePath" type="text" size="60" value="/public/del.txt">
  <button id="deleteBtn">Delete File</button>

  <p id="status"></p>

  <script>
  document.getElementById('deleteBtn').addEventListener('click', function () {
    var input = document.getElementById('filePath');
    var status = document.getElementById('status');
    var path = input.value.trim();

    // Must start with /public/
    if (!path.startsWith('/public/')) {
      alert('Error: You can only delete files in /public/');
      return;
    }

    var url = 'http://localhost:8080' + path;
    status.textContent = 'Sending DELETE request to ' + url + ' ...';

    fetch(url, { method: 'DELETE' })
      .then(function (response) {
        if (response.ok) {
          status.textContent = '✅ File deleted successfully (HTTP ' + response.status + ')';
          // Optionally redirect to success page (as your server returns one)
          window.location.href = 'http://localhost:8080/notif/delete_success.html';
        } else {
          status.textContent = '❌ Failed (HTTP ' + response.status + ' ' + response.statusText + ')';
        }
      })
      .catch(function (error) {
        status.textContent = '⚠️ Network error: ' + error;
      });
  });
  </script>
</body>
</html>
