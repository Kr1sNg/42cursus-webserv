<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test CGI POST</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: url('images/CGI_menu.jpg') no-repeat center 45% fixed;
            background-size: 100%; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            animation: floatBackground 12s ease-in-out infinite;
        }

        @keyframes floatBackground {
            0% { background-position: center 45%; }
            50% { background-position: center 48%; }
            100% { background-position: center 45%; }
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2.5rem;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-radius: 0 0 20px 20px;
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 1.8rem;
            color: #444;
            margin: 0;
        }
        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #555;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #ff8c8c;
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        form {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: floatForm 5s ease-in-out infinite;
        }

        @keyframes floatForm {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h2 {
            margin-bottom: 20px;
            color: #444;
			background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="file"] {
            display: block;
            margin: 0 auto 15px auto;
        }

        input[type="submit"] {
            background-color: #ffb6b6;
            color: #444;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #ff9b9b;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Webserv</h1>
        <nav>
            <a href="/">FORM</a>
            <a href="/uploads/">Uploads</a>
            <a href="/delete/">Delete</a>
            <a href="/form.html">CGI</a>
            <a href="/session/">Session</a>
        </nav>
    </header>

<main style="display: flex; flex-direction: column; gap: 40px; max-width: 400px; margin: auto;">
  <section>
    <h2>Test de requête POST vers CGI bash</h2>
    <form action="/cgi-bin/bash/test.sh" method="POST" style="display: flex; flex-direction: column; gap: 10px;">
      <label>Nom :</label>
      <input type="text" name="nom" value="">

      <label>Langage préféré :</label>
      <input type="text" name="langage" value="">

      <input type="submit" value="Envoyer au CGI bash">
    </form>
  </section>

  <section>
    <h2>Test de requête POST vers CGI perl</h2>
    <form action="/cgi-bin/perl/test.pl" method="POST" style="display: flex; flex-direction: column; gap: 10px;">
      <label>Nom :</label>
      <input type="text" name="nom" value="">

      <label>Langage préféré :</label>
      <input type="text" name="langage" value="">

      <input type="submit" value="Envoyer au CGI perl">
    </form>
  </section>
</main>


    <footer>
        © 2025 Webserv — Made by 3 weebs
    </footer>

</body>
</html>
