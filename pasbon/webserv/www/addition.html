<!DOCTYPE html>
<html lang="en">
	<head>
		<script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
		<title>Counter - React</title>
	</head>
	<body>
		<div id="app"></div>

		<!-- we write in JSX, then we have babel which translate JSX to js -->
		<script type="text/babel">

			function App() {

				const [state, setState] = React.useState({
					num1: 2,
					num2: 4,
					response: "",
					score: 0
				});
				
				function inputKeyPress(event) {
					if (event.key === "Enter") {
						const answer = parseInt(state.response);
						if (state.num1 + state.num2 === answer) {
							// user got answer right
							setState({
								...state,
								num1: Math.ceil(Math.random() * 10),
								num2: Math.ceil(Math.random() * 10),
								score: state.score + 1,
								response: ""
							});
						} else { // answer wrong
							setState({
								...state,
								score: state.score - 1,
								response: ""
							});
						}
					}
				}

				function updateResponse(event) {
					setState({
						...state, // keep other values the same with state
						response: event.target.value //change only response
					});
				}

				return (
					<div>
						<div>{state.num1} + {state.num2}</div>
						<input onKeyPress={inputKeyPress} onChange={updateResponse} value={state.response} />
						<div>Score: {state.score}</div>
					</div>
				);
			}

			ReactDOM.render(<App />, document.querySelector("#app")); // Render App inside HTLM where there's id="app"
		</script>
	</body>
</html>
