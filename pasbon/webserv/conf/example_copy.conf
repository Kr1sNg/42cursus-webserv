
server {
    listen 127.0.0.1:8080;
    listen 8081;
    server_name server1;
    root www;

    location / {
        root html;
		index index2.html;
        autoindex on;
		methods GET;
    }

    location /cgi-bin/ {
		cgi_pass /usr/bin/python3;
		methods GET POST DELETE;
     
    }

	location /cgi-bin/bash/
	{
		cgi_pass /usr/bin/env bash;
		methods GET POST DELETE;
	}
    location /new/ {
        methods GET POST;

    }

    location /uploads/ {
        methods POST;
    }

    error_page 404 /404.html;
    error_page 405 /405.html;
}

server {
    listen 0.0.0.0:8082;
    server_name server2;
    location / {
        root ./tests;
        index index.html;
        autoindex off;
    }

    location /images/ {
        root ./assets;
        autoindex on;
    }

    error_page 500 /500.html;
}

server {
    listen 8000;
    server_name server3;

    location / {
        root www;
        index index2.html;
        autoindex on;
        methods GET POST;
    }
}